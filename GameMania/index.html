<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Mani</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        header {
            background: #00bcd4;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
        }
        header h1 {
            margin: 0;
        }
        nav a {
            margin-left: 15px;
           color: #fff;
            text-decoration: none;
            font-weight: bold;
        }
        .banner {
            background: #000; 
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .banner h2 {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 10px;
        }
        section {
            padding: 30px;
        }
        .produtos, .galeria {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .card {
            background: #fff;
            border-radius: 6px;
            box-shadow: 0 0 5px #ccc;
            width: 260px;
            padding-bottom: 20px;
        }
        .card h3 {
            font-size: 18px;
            padding: 10px;
        }
        .card p {
            padding: 0 10px;
            color: #444;
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #00bcd4;
            color: #fff;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Gamer Mania</h1>

        <nav>
            <a href="home.html">home</a>
            <a href="#produtos">Produtos</a>
            <a href="#galeria">Galeria</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <div class="banner">
        <h2>Promoções Especiais para gamers</h2>
    </div>

    <section id="produtos">
        <h2>Produtos em Destaque</h2>

        <div class="produtos">
            <div class="card">
                <img src="img/imagem teclado.jpg" style="width: 200px; height: auto;">
                <h3>Teclado Mecânico</h3>
                <p>R$ 149,99</p>
            </div>

            <div class="card">
                <img src="img/imagem 2 mouse.jpeg">
                <h3>Mouse Gamer</h3>
                <p>R$ 99,99</p>
            </div>

            <div class="card">
                <img src="img/imagem 3 headset.jpeg">
                <h3>headset Gamer</h3>
                <p>R$ 279,99</p>
            </div>
        </div>
    </section>

    <selection id="galeria">
        <H2>Galeria</H2>

        <div class="galeria">
            <div class="card">
                <img src="img/banner 1.webp">
            </div>

            <div class="card">
                <img src="img/banner 2.webp">
            </div>

            <div class="card">
                <img src="img/banner 3.webp">
            </div>
        </div>
    </selection>

    <footer>
        Gamer Mania © 2025 - Todos os Direitos Reservados.
    </footer>
    
</body>
</html>
